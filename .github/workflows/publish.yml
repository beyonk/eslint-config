name: publish

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: dependencies
        run: |
          npm i -g corepack@latest
          corepack enable
          corepack install
          pnpm i

      - run: pnpm test:ci

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: dependencies
        run: |
          corepack enable
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
          pnpm i
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish to github packages
        run: pnpm publish --registry https://npm.pkg.github.com --no-git-checks

      - name: publish to npm
        run: pnpm publish --registry https://registry.npmjs.org --no-git-checks --provenance
